name: Create Release

on:
  create:
  push:
    branches:
      - "release/v*"
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to create the release under (e.g. v1.0.0)"
        required: true
        default: "v1.0.0"

permissions:
  contents: write

jobs:
  release:
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      startsWith(github.ref, 'refs/heads/release/v') ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          case "$GITHUB_REF" in
            refs/tags/*)
              tag="${GITHUB_REF#refs/tags/}"
              extra_args=(--verify-tag)
              ;;
            refs/heads/release/*)
              tag="${GITHUB_REF#refs/heads/release/}"
              extra_args=(--target "$GITHUB_SHA")
              ;;
            *)
              tag="${{ inputs.tag }}"
              extra_args=(--target "$GITHUB_SHA")
              ;;
          esac

          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $tag already exists; nothing to do."
            exit 0
          fi

          notes_file=".github/release-notes/${tag}.md"
          if [ ! -f "$notes_file" ]; then
            echo "Release notes file $notes_file not found" >&2
            exit 1
          fi

          gh release create "$tag" \
            --repo "$GITHUB_REPOSITORY" \
            --title "OCSP Server Test Suite $tag" \
            --notes-file "$notes_file" \
            "${extra_args[@]}"
