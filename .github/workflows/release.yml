name: Create Release

on:
  create:
  push:
    branches:
      - "release/v*"
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to create the release under (e.g. v1.0.2)"
        required: true
        default: "v1.0.2"
      skip_checks:
        description: "OWNER OVERRIDE: publish the release even though checks failed (use only after reviewing the failure)"
        type: boolean
        required: false
        default: false

permissions:
  contents: write
  issues: write

jobs:
  # Every release candidate must pass the same checks as CI:
  # smoke test on all supported Python versions + dependency CVE audit.
  checks:
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      startsWith(github.ref, 'refs/heads/release/v') ||
      github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      issues: write

  release:
    runs-on: ubuntu-latest
    needs: [checks]
    # Publish only when checks passed, or when a human explicitly set the
    # skip_checks override on a manual run after reviewing the failure.
    if: >-
      always() &&
      (startsWith(github.ref, 'refs/tags/v') ||
       startsWith(github.ref, 'refs/heads/release/v') ||
       github.event_name == 'workflow_dispatch') &&
      (needs.checks.result == 'success' ||
       (github.event_name == 'workflow_dispatch' && inputs.skip_checks))
    steps:
      - uses: actions/checkout@v4

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          case "$GITHUB_REF" in
            refs/tags/*)
              tag="${GITHUB_REF#refs/tags/}"
              extra_args=(--verify-tag)
              ;;
            refs/heads/release/*)
              tag="${GITHUB_REF#refs/heads/release/}"
              extra_args=(--target "$GITHUB_SHA")
              ;;
            *)
              tag="${{ inputs.tag }}"
              extra_args=(--target "$GITHUB_SHA")
              ;;
          esac

          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $tag already exists; nothing to do."
            exit 0
          fi

          notes_file=".github/release-notes/${tag}.md"
          if [ ! -f "$notes_file" ]; then
            echo "Release notes file $notes_file not found" >&2
            exit 1
          fi

          if [ "${{ needs.checks.result }}" != "success" ]; then
            echo "::warning::Release published with skip_checks override; checks result was: ${{ needs.checks.result }}"
          fi

          gh release create "$tag" \
            --repo "$GITHUB_REPOSITORY" \
            --title "OCSP Server Test Suite $tag" \
            --notes-file "$notes_file" \
            "${extra_args[@]}"

  # If checks failed, no release is created. Alert the owner with an issue
  # so a human can fix the problem or consciously decide to release anyway.
  alert-release-blocked:
    runs-on: ubuntu-latest
    needs: [checks]
    if: >-
      always() && needs.checks.result == 'failure' &&
      !(github.event_name == 'workflow_dispatch' && inputs.skip_checks)
    steps:
      - name: Open issue describing the blocked release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          case "$GITHUB_REF" in
            refs/tags/*)           tag="${GITHUB_REF#refs/tags/}" ;;
            refs/heads/release/*)  tag="${GITHUB_REF#refs/heads/release/}" ;;
            *)                     tag="${{ inputs.tag }}" ;;
          esac
          title="Release $tag blocked: pre-release checks failed"
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --search "in:title \"$title\"" --json number --jq 'length')
          if [ "$existing" -gt 0 ]; then
            echo "An alert issue for $tag is already open; not creating a duplicate."
            exit 0
          fi
          {
            echo "A release of **$tag** was requested, but the pre-release checks (smoke test and dependency CVE audit) failed, so **no release was published**."
            echo ""
            echo "Failed run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo ""
            echo "Your options:"
            echo "1. **Fix the problem** (code fix or dependency bump), push it, and trigger the release again — it will publish automatically once checks pass."
            echo "2. **Decide to release anyway**: go to Actions -> Create Release -> Run workflow, enter the tag, and set skip_checks. This is logged as an explicit owner override."
            echo ""
            echo "Close this issue once resolved."
          } > issue-body.md
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "$title" \
            --assignee "${{ github.repository_owner }}" \
            --body-file issue-body.md
