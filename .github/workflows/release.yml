name: Create Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to create the release under (e.g. v1.0.0)"
        required: true
        default: "v1.0.0"
      target:
        description: "Branch or commit SHA the tag should point to"
        required: true
        default: "main"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          notes_file=".github/release-notes/${{ inputs.tag }}.md"
          if [ ! -f "$notes_file" ]; then
            echo "Release notes file $notes_file not found" >&2
            exit 1
          fi
          gh release create "${{ inputs.tag }}" \
            --repo "${{ github.repository }}" \
            --target "${{ inputs.target }}" \
            --title "OCSP Server Test Suite ${{ inputs.tag }}" \
            --notes-file "$notes_file"
